<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Music Player</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="player">
      <section class="player-card">
        <div class="player-header">
          <div>
            <p class="eyebrow">NOW PLAYING</p>
            <h1>Music Player</h1>
          </div>

          <button id="shuffleBtn" class="icon-btn" title="Shuffle">
            <span>Arizona Digital DJ MIX</span>
          </button>
        </div>

        <div class="album-area">
          <div class="album-cover">
            <div class="cover-inner">
              <span id="coverLetter">M</span>
            </div>
          </div>

          <div class="song-details">
            <h2 id="songTitle">Lonely At the Top</h2>
            <p id="artistName">Asake</p>
          </div>
        </div>

        <audio id="audio"></audio>
        <div class="progress-section">
          <input type="range" id="progressBar" min="0" max="100" value="0" />

          <div class="time-display">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
          </div>
        </div>

        <div class="controls">
          <button id="previousBtn" class="control-btn" title="Previous">
            <span>PREV</span>
          </button>

          <button id="playBtn" class="play-btn" title="Play">
            <span id="playText">PLAY</span>
          </button>

          <button id="nextBtn" class="control-btn" title="Next">
            <span>NEXT</span>
          </button>
        </div>

        <div class="volume-section">
          <span class="volume-label">VOLUME</span>

          <input
            type="range"
            id="volumeBar"
            min="0"
            max="1"
            step="0.01"
            value="0.8"
          />

          <span id="volumeValue">80%</span>
        </div>

        <div class="playlist-header">
          <h3>Playlist</h3>

          <label class="autoplay">
            <input type="checkbox" id="autoplayToggle" checked />
            <span>Autoplay</span>
          </label>
        </div>

        <div id="playlist" class="playlist"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
